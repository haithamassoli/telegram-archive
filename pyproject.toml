[project]
name = "telegram-archive"
version = "0.1.0"
description = "Telegram Knowledge Archive pipeline"
requires-python = ">=3.11"
# zstandard: the meta batches are .jsonl.zst per plan §3, and the stdlib
# only ships zstd from Python 3.14 (this project runs on 3.11).
dependencies = ["boto3", "telethon", "zstandard"]

[project.optional-dependencies]
# The M2 GPU stage only. `uv sync --extra gpu` on the machine that transcribes;
# it pulls torch, and nothing before Phase 2 needs it.
gpu = ["cohere-transcribe==0.1.4"]

[project.scripts]
archive = "archive.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archive"]

[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
